<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ACS Body Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel2: #1c2230;
    --border: #252c3a;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #7c9cff;
    --good: #4ade80;
    --warn: #f59e0b;
    --bad: #ef4444;
    --fat: #f59e0b;
    --lean: #4ade80;
    --bone: #7c9cff;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
  }
  header {
    padding: 22px 28px 10px;
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 600 }
  header .sub { color: var(--muted); font-size: 13px }
  header nav a {
    color: var(--muted); text-decoration: none; font-size: 13px; margin-right: 14px;
    border-bottom: 1px solid transparent; padding-bottom: 2px;
  }
  header nav a:hover { color: var(--text); border-bottom-color: var(--accent) }
  header nav a.active { color: var(--text); border-bottom-color: var(--accent) }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
    padding: 12px 24px 40px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    min-height: 0;
  }
  .card h2 {
    margin: 0 0 10px 0; font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .span-3 { grid-column: span 3 }
  .span-4 { grid-column: span 4 }
  .span-6 { grid-column: span 6 }
  .span-8 { grid-column: span 8 }
  .span-12 { grid-column: span 12 }
  @media (max-width: 960px) {
    .span-3, .span-4, .span-6, .span-8 { grid-column: span 12 }
  }
  .stat { font-size: 34px; font-weight: 700; line-height: 1 }
  .stat .unit { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px }
  .stat-sub { color: var(--muted); font-size: 12px; margin-top: 6px }
  .stat-sub .up { color: var(--bad) }
  .stat-sub .down { color: var(--good) }
  .stat-sub .flat { color: var(--muted) }
  .chart { width: 100%; height: 300px }
  .chart-tall { height: 360px }
  .chart-short { height: 200px }
  .loading, .error {
    padding: 32px; text-align: center; color: var(--muted);
  }
  .error { color: var(--bad) }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--panel2); color: var(--muted);
    font-size: 11px; border: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px }
  table th, table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border) }
  table th { color: var(--muted); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em }
  table td.num { text-align: right; font-variant-numeric: tabular-nums }
  table th.num { text-align: right }
  .change-pos { color: var(--good) }
  .change-neg { color: var(--bad) }
  .change-flat { color: var(--muted) }
  .legend { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap }
  .legend-item { display: flex; align-items: center; gap: 4px }
  .legend-swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  }
  .note { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 8px }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline }
  .row > div { flex: 1; min-width: 140px }

  /* Comparison bars (where you stand) */
  .compare-row {
    display: grid;
    grid-template-columns: 130px 1fr 100px;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    font-size: 12px;
  }
  .compare-label { color: var(--muted); font-weight: 500 }
  .compare-label small { display: block; color: var(--muted); opacity: 0.7; font-size: 10px;
    text-transform: uppercase; letter-spacing: .04em; margin-top: 2px }
  .compare-value { color: var(--text); font-weight: 600; text-align: right;
    font-variant-numeric: tabular-nums; font-size: 14px }
  .compare-value small { display: block; color: var(--muted); font-size: 10px; font-weight: 500 }
  .compare-track {
    position: relative; height: 26px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 5px;
  }
  .compare-seg {
    position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: var(--muted); padding: 0 2px; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }
  .compare-seg:last-child { border-right: none }
  .compare-marker {
    position: absolute; top: -4px; bottom: -4px; width: 3px;
    background: var(--accent); border-radius: 2px; z-index: 2;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
  }
  .compare-marker::after {
    content: ''; position: absolute; top: -6px; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent; border-bottom-color: var(--accent);
  }
  @media (max-width: 600px) {
    .compare-row { grid-template-columns: 90px 1fr 80px; gap: 8px }
    .compare-seg { font-size: 8px }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>ACS Body Dashboard</h1>
    <div class="sub" id="data-status">Loading data…</div>
  </div>
  <nav>
    <a href="index.html">Gym</a>
    <a href="body.html" class="active">Body</a>
  </nav>
  <div class="pill" id="data-range"></div>
</header>

<div id="content" class="loading">Fetching weight log…</div>

<script>
// ============================================================
// Config
// ============================================================
const WEIGHT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZcwe6JZcbhyEe_QjWziIp6hfssOgZZAaWeLGXAQ5y9Q43PsyVD5Cdv6T85SAi1IDlqdRtJiWFb2ok/pub?gid=1881423293&single=true&output=csv";

// Personal constants (from DEXA reports)
const HEIGHT_CM = 175.3;             // 5'9" — adjust if it ever changes
const HEIGHT_M = HEIGHT_CM / 100;
const HEIGHT_M2 = HEIGHT_M * HEIGHT_M;

const LBS_PER_KG = 2.20462;
const lb2kg = (lbs) => lbs / LBS_PER_KG;

// Hardcoded DEXA scans. Add new scans by appending a record.
const DEXA_SCANS = [
  {
    date: "2026-03-19",
    totalLbs: 157.8, fatLbs: 37.0, leanLbs: 114.0, bmcLbs: 6.7,
    bodyFatPct: 23.5,
    vatLbs: 1.47,
    rmrKcal: 1492,
    androidFatPct: 26.8, gynoidFatPct: 26.9, agRatio: 1.00,
    boneZScore: 1.7,
    regions: {
      Arms:  { fatPct: 16.6, totalLbs: 21.8, fatLbs: 3.6,  leanLbs: 17.2, bmcLbs: 1.0 },
      Legs:  { fatPct: 24.6, totalLbs: 57.1, fatLbs: 14.0, leanLbs: 40.4, bmcLbs: 2.7 },
      Trunk: { fatPct: 25.5, totalLbs: 68.1, fatLbs: 17.4, leanLbs: 49.0, bmcLbs: 1.7 },
    },
    sides: {
      "Right arm": { leanLbs: 8.7, fatLbs: 1.8, fatPct: 16.5, totalLbs: 11.0 },
      "Left arm":  { leanLbs: 8.5, fatLbs: 1.8, fatPct: 16.8, totalLbs: 10.8 },
      "Right leg": { leanLbs: 20.4, fatLbs: 7.1, fatPct: 24.7, totalLbs: 28.9 },
      "Left leg":  { leanLbs: 19.9, fatLbs: 6.9, fatPct: 24.4, totalLbs: 28.2 },
    },
  },
  {
    date: "2026-03-22",
    totalLbs: 156.4, fatLbs: 35.3, leanLbs: 114.3, bmcLbs: 6.7,
    bodyFatPct: 22.6,
    vatLbs: 1.63,
    rmrKcal: 1495,
    androidFatPct: 26.6, gynoidFatPct: 24.3, agRatio: 1.10,
    boneZScore: 1.7,
    regions: {
      Arms:  { fatPct: 15.5, totalLbs: 21.4, fatLbs: 3.3,  leanLbs: 17.1, bmcLbs: 1.0 },
      Legs:  { fatPct: 23.5, totalLbs: 55.8, fatLbs: 13.1, leanLbs: 40.0, bmcLbs: 2.7 },
      Trunk: { fatPct: 24.6, totalLbs: 68.9, fatLbs: 17.0, leanLbs: 50.2, bmcLbs: 1.7 },
    },
    sides: {
      "Right arm": { leanLbs: 8.7, fatLbs: 1.7, fatPct: 15.3, totalLbs: 10.9 },
      "Left arm":  { leanLbs: 8.4, fatLbs: 1.6, fatPct: 15.6, totalLbs: 10.5 },
      "Right leg": { leanLbs: 19.9, fatLbs: 6.6, fatPct: 23.7, totalLbs: 27.8 },
      "Left leg":  { leanLbs: 20.1, fatLbs: 6.6, fatPct: 23.4, totalLbs: 28.0 },
    },
  },
];

// ============================================================
// Body composition index calculations
// ============================================================
function ffm(scan)            { return lb2kg(scan.leanLbs) + lb2kg(scan.bmcLbs); }
function ffmi(scan)           { return ffm(scan) / HEIGHT_M2; }
// Kouri normalization: adjusts to 1.80 m reference so short/tall are comparable
function ffmiNormalized(scan) { return ffmi(scan) + 6.1 * (1.8 - HEIGHT_M); }

function appendicularLeanKg(scan) {
  const s = scan.sides;
  return lb2kg(
    s["Right arm"].leanLbs + s["Left arm"].leanLbs +
    s["Right leg"].leanLbs + s["Left leg"].leanLbs
  );
}
function almi(scan)  { return appendicularLeanKg(scan) / HEIGHT_M2; }
function vatKg(scan) { return lb2kg(scan.vatLbs); }

// ============================================================
// Reference brackets (men). Sources: Kouri 1995 (FFMI),
// EWGSOP2 2019 (ALMI), BodySpec 30-39 (BF%), DEXA literature (A/G, VAT, Z).
// ============================================================
const BRACKETS = {
  ffmiNormalized: {
    unit: "kg/m²",
    domain: [16, 25],
    segments: [
      { max: 18,   label: "untrained" },
      { max: 19.5, label: "novice" },
      { max: 21,   label: "intermediate" },
      { max: 22.5, label: "advanced" },
      { max: 24,   label: "elite natural" },
      { max: 25,   label: "ceiling" },
    ],
  },
  almi: {
    unit: "kg/m²",
    domain: [6, 11],
    segments: [
      { max: 7,  label: "sarcopenia" },
      { max: 8,  label: "low" },
      { max: 9,  label: "average" },
      { max: 10, label: "above avg" },
      { max: 11, label: "athletic" },
    ],
  },
  bodyFatPct: {
    unit: "%",
    domain: [5, 35],
    segments: [
      { max: 11, label: "essential" },
      { max: 14, label: "athletic" },
      { max: 17, label: "fit" },
      { max: 22, label: "fitness" },
      { max: 26, label: "average" },
      { max: 30, label: "above avg" },
      { max: 35, label: "obese" },
    ],
  },
  vatKg: {
    unit: "kg",
    domain: [0, 3],
    segments: [
      { max: 0.5, label: "very low" },
      { max: 1.0, label: "low" },
      { max: 1.5, label: "average" },
      { max: 2.0, label: "elevated" },
      { max: 3.0, label: "high risk" },
    ],
  },
  agRatio: {
    unit: "",
    domain: [0.6, 1.4],
    segments: [
      { max: 0.8, label: "gynoid" },
      { max: 1.0, label: "balanced" },
      { max: 1.2, label: "android" },
      { max: 1.4, label: "high android" },
    ],
  },
  boneZ: {
    unit: "",
    domain: [-3, 3],
    segments: [
      { max: -2, label: "osteoporosis" },
      { max: -1, label: "below avg" },
      { max:  1, label: "normal" },
      { max:  2, label: "above avg" },
      { max:  3, label: "very high" },
    ],
  },
};

function bracketLabel(metricKey, value) {
  const b = BRACKETS[metricKey];
  if (!b) return "";
  for (const seg of b.segments) {
    if (value <= seg.max) return seg.label;
  }
  return b.segments[b.segments.length - 1].label;
}

// ============================================================
// Helpers
// ============================================================
function parseDate(s) {
  if (!s) return null;
  const str = String(s).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) {
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return isNaN(d) ? null : d;
  }
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) {
    const yy = +m[1], mm = +m[2], dd = +m[3];
    if (yy <= 99 && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
      const d = new Date(Date.UTC(2000 + yy, mm - 1, dd));
      return isNaN(d) ? null : d;
    }
  }
  return null;
}

function toISODate(d) { return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function fmt(n, dp = 1) { return n == null || isNaN(n) ? "–" : n.toFixed(dp) }

function rollingMean(xs, window) {
  const half = Math.floor(window / 2);
  const out = new Array(xs.length).fill(null);
  for (let i = 0; i < xs.length; i++) {
    let sum = 0, n = 0;
    for (let j = Math.max(0, i - half); j <= Math.min(xs.length - 1, i + half); j++) {
      if (xs[j] != null) { sum += xs[j]; n++; }
    }
    if (n >= Math.ceil(window / 3)) out[i] = sum / n;
  }
  return out;
}

function recentTrendKgPerDay(weights, days) {
  const cutoff = new Date(); cutoff.setUTCDate(cutoff.getUTCDate() - days);
  const recent = weights.filter(w => w.date >= cutoff);
  if (recent.length < 5) return null;
  const t0 = recent[0].date.getTime();
  const xs = recent.map(w => (w.date.getTime() - t0) / 86400000);
  const ys = recent.map(w => w.kg);
  const n = xs.length;
  const meanX = xs.reduce((a, b) => a + b, 0) / n;
  const meanY = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - meanX) * (ys[i] - meanY);
    den += (xs[i] - meanX) ** 2;
  }
  return den === 0 ? null : num / den;
}

// ============================================================
// Weight CSV parsing
// ============================================================
function parseWeightCSV(rows) {
  let headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const r = (rows[i] || []).map(c => String(c || "").trim().toLowerCase());
    if (r.some(c => c === "date") && r.some(c => c.startsWith("weight"))) {
      headerIdx = i; break;
    }
  }
  if (headerIdx < 0) return [];

  const header = rows[headerIdx].map(c => String(c || "").trim().toLowerCase());
  const dateCol = header.findIndex(c => c === "date");
  const weightCol = header.findIndex(c => c.startsWith("weight"));

  const records = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const dStr = (r[dateCol] || "").trim();
    const wStr = (r[weightCol] || "").trim();
    if (!dStr || !wStr) continue;
    const date = parseDate(dStr);
    const kg = parseFloat(wStr);
    if (!date || isNaN(kg)) continue;
    if (kg < 50 || kg > 110) continue;
    records.push({ date, kg });
  }
  records.sort((a, b) => a.date - b.date);

  const byDay = new Map();
  for (const r of records) {
    const k = toISODate(r.date);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(r.kg);
  }
  const collapsed = [];
  for (const [k, vals] of byDay) {
    collapsed.push({ date: new Date(k + "T00:00:00Z"),
                      kg: vals.reduce((a, b) => a + b, 0) / vals.length });
  }
  collapsed.sort((a, b) => a.date - b.date);
  return collapsed;
}

function fillDailySeries(weights) {
  if (weights.length === 0) return [];
  const start = new Date(weights[0].date);
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const lookup = new Map(weights.map(w => [toISODate(w.date), w.kg]));
  const out = [];
  for (let d = new Date(start); d <= end; d = new Date(d.getTime() + 86400000)) {
    const k = toISODate(d);
    out.push({ date: new Date(d), iso: k, kg: lookup.has(k) ? lookup.get(k) : null });
  }
  return out;
}

// ============================================================
// Rendering
// ============================================================
const layoutDefaults = {
  paper_bgcolor: "rgba(0,0,0,0)",
  plot_bgcolor: "rgba(0,0,0,0)",
  font: { family: "inherit", color: "#e6e8ee", size: 12 },
  margin: { l: 48, r: 20, t: 10, b: 40 },
  xaxis: { gridcolor: "#252c3a", zerolinecolor: "#252c3a", tickcolor: "#8a93a6" },
  yaxis: { gridcolor: "#252c3a", zerolinecolor: "#252c3a", tickcolor: "#8a93a6" },
  hoverlabel: { bgcolor: "#1c2230", bordercolor: "#252c3a" },
};
const plotlyConfig = { responsive: true, displayModeBar: false };

function renderDashboard(weights) {
  const content = document.getElementById("content");
  content.className = "";
  content.classList.add("grid");

  const hasWeight = weights.length > 0;
  const latest = hasWeight ? weights[weights.length - 1] : null;
  const firstDate = hasWeight ? weights[0].date : null;

  const dailySeries = fillDailySeries(weights);
  const ys = dailySeries.map(d => d.kg);
  const ma7 = rollingMean(ys, 7);
  const ma30 = rollingMean(ys, 30);

  const last7 = ma7[ma7.length - 1];
  const prevIdx = ma7.length - 1 - 7;
  const prev7 = prevIdx >= 0 ? ma7[prevIdx] : null;
  const wkDelta = (last7 != null && prev7 != null) ? last7 - prev7 : null;

  const trendKgPerDay = recentTrendKgPerDay(weights, 30);
  const trendKgPerWeek = trendKgPerDay != null ? trendKgPerDay * 7 : null;

  const lastDexa = DEXA_SCANS[DEXA_SCANS.length - 1];
  const lastDexaDate = parseDate(lastDexa.date);
  const daysSinceDexa = daysBetween(lastDexaDate, new Date());

  // Body composition indices (latest scan)
  const ffmiVal  = ffmi(lastDexa);
  const ffmiNorm = ffmiNormalized(lastDexa);
  const almiVal  = almi(lastDexa);
  const vatVal   = vatKg(lastDexa);

  // ---- Header ----
  document.getElementById("data-status").textContent =
    `${weights.length} weigh-ins · ${DEXA_SCANS.length} DEXA scan${DEXA_SCANS.length > 1 ? "s" : ""} · height ${HEIGHT_CM} cm`;
  document.getElementById("data-range").textContent =
    firstDate ? `${toISODate(firstDate)} → ${toISODate(latest.date)}` : "";

  content.innerHTML = `
    <div class="card span-3">
      <h2>Latest weight</h2>
      <div class="stat">${hasWeight ? fmt(latest.kg, 2) : "–"}<span class="unit">kg</span></div>
      <div class="stat-sub">${hasWeight ? toISODate(latest.date) : ""}</div>
    </div>
    <div class="card span-3">
      <h2>7-day average</h2>
      <div class="stat">${fmt(last7, 2)}<span class="unit">kg</span></div>
      <div class="stat-sub">${formatDelta(wkDelta, "vs prev wk")}</div>
    </div>
    <div class="card span-3">
      <h2>30-day trend</h2>
      <div class="stat">${trendKgPerWeek == null ? "–" : (trendKgPerWeek >= 0 ? "+" : "") + fmt(trendKgPerWeek, 2)}<span class="unit">kg / wk</span></div>
      <div class="stat-sub">${trendDescription(trendKgPerWeek)}</div>
    </div>
    <div class="card span-3">
      <h2>Last DEXA</h2>
      <div class="stat">${daysSinceDexa}<span class="unit">days ago</span></div>
      <div class="stat-sub">${lastDexa.date} · ${fmt(lastDexa.bodyFatPct, 1)}% BF</div>
    </div>

    <div class="card span-12">
      <h2>Weight (kg) over time</h2>
      <div id="chart-weight" class="chart chart-tall"></div>
      <div class="legend" style="margin-top: 8px">
        <div class="legend-item"><span class="legend-swatch" style="background:#3a4359"></span> Raw daily</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#7c9cff"></span> 7-day avg</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#4ade80"></span> 30-day avg</div>
      </div>
      <div class="note">Daily weight has ±0.5 kg of noise (water, glycogen, food). The 7-day and 30-day averages are the actual signal.</div>
    </div>

    <div class="card span-3">
      <h2>Lean mass</h2>
      <div class="stat">${fmt(lb2kg(lastDexa.leanLbs), 1)}<span class="unit">kg</span></div>
      <div class="stat-sub">${dexaChange("leanLbs", "kg", "up")}</div>
    </div>
    <div class="card span-3">
      <h2>Fat mass</h2>
      <div class="stat">${fmt(lb2kg(lastDexa.fatLbs), 1)}<span class="unit">kg</span></div>
      <div class="stat-sub">${dexaChange("fatLbs", "kg", "down")}</div>
    </div>
    <div class="card span-3">
      <h2>Body fat %</h2>
      <div class="stat">${fmt(lastDexa.bodyFatPct, 1)}<span class="unit">%</span></div>
      <div class="stat-sub">${dexaChange("bodyFatPct", "%", "down")} · ${bracketLabel("bodyFatPct", lastDexa.bodyFatPct)}</div>
    </div>
    <div class="card span-3">
      <h2>VAT</h2>
      <div class="stat">${fmt(vatVal * 1000, 0)}<span class="unit">g</span></div>
      <div class="stat-sub">${dexaChange("vatLbs", "kg", "down")} · ${bracketLabel("vatKg", vatVal)}</div>
    </div>

    <div class="card span-3">
      <h2>FFMI (normalized)</h2>
      <div class="stat">${fmt(ffmiNorm, 2)}<span class="unit">kg/m²</span></div>
      <div class="stat-sub">raw ${fmt(ffmiVal, 2)} · ${bracketLabel("ffmiNormalized", ffmiNorm)}</div>
    </div>
    <div class="card span-3">
      <h2>ALMI</h2>
      <div class="stat">${fmt(almiVal, 2)}<span class="unit">kg/m²</span></div>
      <div class="stat-sub">${fmt(appendicularLeanKg(lastDexa), 1)} kg limb · ${bracketLabel("almi", almiVal)}</div>
    </div>
    <div class="card span-3">
      <h2>A/G ratio</h2>
      <div class="stat">${fmt(lastDexa.agRatio, 2)}</div>
      <div class="stat-sub">${bracketLabel("agRatio", lastDexa.agRatio)} fat distribution</div>
    </div>
    <div class="card span-3">
      <h2>Bone Z-score</h2>
      <div class="stat">${lastDexa.boneZScore >= 0 ? "+" : ""}${fmt(lastDexa.boneZScore, 1)}</div>
      <div class="stat-sub">${bracketLabel("boneZ", lastDexa.boneZScore)} vs age peers</div>
    </div>

    <div class="card span-12">
      <h2>Where you stand · men reference ranges</h2>
      <div id="compare-block"></div>
      <div class="note">
        <b>FFMI</b> measures muscularity independent of body fat (fat-free mass / height²). Normalized FFMI adjusts to a 1.80 m reference so heights compare fairly.
        <b>ALMI</b> is limb-only lean mass / height² — used clinically to screen for sarcopenia.
        <b>A/G ratio</b> compares android (lower abdomen) to gynoid (hips) fat — elevated values mean central fat storage, which carries higher metabolic risk.
        Brackets are general male reference ranges; individual variation is large.
      </div>
    </div>

    <div class="card span-6">
      <h2>Body composition by scan</h2>
      <div id="chart-composition" class="chart"></div>
    </div>
    <div class="card span-6">
      <h2>Regional fat & lean (latest scan)</h2>
      <div id="chart-regional" class="chart"></div>
    </div>

    <div class="card span-6">
      <h2>Symmetry check (latest scan)</h2>
      <table id="symmetry-table"></table>
      <div class="note" id="symmetry-note"></div>
    </div>
    <div class="card span-6">
      <h2>DEXA scan history</h2>
      <table id="dexa-table"></table>
      ${DEXA_SCANS.length === 2 && Math.abs(daysBetween(parseDate(DEXA_SCANS[0].date), parseDate(DEXA_SCANS[1].date))) <= 7
        ? `<div class="note">⚠ The two scans on file are ${Math.abs(daysBetween(parseDate(DEXA_SCANS[0].date), parseDate(DEXA_SCANS[1].date)))} days apart — the deltas reflect measurement noise (DEXA accuracy ±0.5%) and hydration, not real fat loss. Treat them as a baseline pair.</div>`
        : ""}
    </div>
  `;

  if (hasWeight) renderWeightChart(dailySeries, ma7, ma30);
  renderCompareBlock(lastDexa);
  renderComposition();
  renderRegional();
  renderSymmetry();
  renderDexaTable();
}

function formatDelta(value, suffix) {
  if (value == null) return "–";
  const cls = Math.abs(value) < 0.05 ? "flat" : (value > 0 ? "up" : "down");
  const sign = value > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${fmt(value, 2)} kg</span> ${suffix}`;
}

function trendDescription(kgPerWeek) {
  if (kgPerWeek == null) return "";
  const abs = Math.abs(kgPerWeek);
  if (abs < 0.1) return "stable";
  const kcalPerDay = (kgPerWeek * 7700) / 7;
  const sign = kcalPerDay > 0 ? "surplus" : "deficit";
  return `~${Math.abs(Math.round(kcalPerDay))} kcal/day ${sign}`;
}

function dexaChange(field, unitLabel, upIsGood = "neutral") {
  if (DEXA_SCANS.length < 2) return "first scan";
  const last = DEXA_SCANS[DEXA_SCANS.length - 1];
  const prev = DEXA_SCANS[DEXA_SCANS.length - 2];
  let lastVal = last[field], prevVal = prev[field];
  if (field.endsWith("Lbs") && unitLabel === "kg") {
    lastVal = lb2kg(lastVal); prevVal = lb2kg(prevVal);
  }
  const delta = lastVal - prevVal;
  const sign = delta > 0 ? "+" : "";
  let cls;
  if (Math.abs(delta) < 0.05) cls = "change-flat";
  else if (upIsGood === "up") cls = delta > 0 ? "change-pos" : "change-neg";
  else if (upIsGood === "down") cls = delta < 0 ? "change-pos" : "change-neg";
  else cls = "change-flat";
  return `<span class="${cls}">${sign}${fmt(delta, 2)} ${unitLabel}</span> vs prev`;
}

// ============================================================
// Comparison bars: render a stacked-segment bar per metric with a marker
// ============================================================
function renderCompareBlock(scan) {
  const rows = [
    { key: "ffmiNormalized", label: "FFMI",       sub: "normalized · kg/m²", value: ffmiNormalized(scan), fmtDp: 2 },
    { key: "almi",           label: "ALMI",       sub: "limb lean · kg/m²",   value: almi(scan),           fmtDp: 2 },
    { key: "bodyFatPct",     label: "Body fat %", sub: "men 30–39",            value: scan.bodyFatPct,      fmtDp: 1 },
    { key: "vatKg",          label: "VAT",        sub: "visceral fat · kg",   value: vatKg(scan),          fmtDp: 2 },
    { key: "agRatio",        label: "A/G ratio",  sub: "fat distribution",     value: scan.agRatio,         fmtDp: 2 },
    { key: "boneZ",          label: "Bone Z",     sub: "vs age peers",         value: scan.boneZScore,      fmtDp: 1 },
  ];

  const host = document.getElementById("compare-block");
  host.innerHTML = rows.map(r => buildCompareRow(r)).join("");
}

function buildCompareRow({ key, label, sub, value, fmtDp }) {
  const b = BRACKETS[key];
  const [lo, hi] = b.domain;
  const range = hi - lo;
  const clamp = (v) => Math.max(lo, Math.min(hi, v));
  const pct = (v) => ((clamp(v) - lo) / range) * 100;

  let segHtml = "";
  let prev = lo;
  for (const seg of b.segments) {
    const left = pct(prev);
    const right = pct(seg.max);
    const width = right - left;
    if (width <= 0) continue;
    segHtml += `<div class="compare-seg" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%">${seg.label}</div>`;
    prev = seg.max;
  }

  const markerPos = pct(value);
  const inRange = value >= lo && value <= hi;
  const markerHtml = `<div class="compare-marker" title="${value.toFixed(fmtDp)}" style="left:${markerPos.toFixed(2)}%"></div>`;
  const sign = (key === "boneZ" && value >= 0) ? "+" : "";
  const outNote = inRange ? "" : ` <small>(off scale)</small>`;

  return `
    <div class="compare-row">
      <div class="compare-label">${label}<small>${sub}</small></div>
      <div class="compare-track">${segHtml}${markerHtml}</div>
      <div class="compare-value">${sign}${value.toFixed(fmtDp)}${outNote}<small>${bracketLabel(key, value)}</small></div>
    </div>
  `;
}

function renderWeightChart(daily, ma7, ma30) {
  const xs = daily.map(d => d.iso);
  const raw = daily.map(d => d.kg);

  const finite = raw.filter(v => v != null);
  const lo = Math.floor(Math.min(...finite) - 1);
  const hi = Math.ceil(Math.max(...finite) + 1);

  const traces = [
    {
      type: "scatter", mode: "markers", name: "Daily",
      x: xs, y: raw,
      marker: { size: 4, color: "#3a4359", opacity: 0.7 },
      hovertemplate: "%{x}<br>%{y:.2f} kg<extra></extra>",
      connectgaps: false,
    },
    {
      type: "scatter", mode: "lines", name: "7-day avg",
      x: xs, y: ma7,
      line: { color: "#7c9cff", width: 2 },
      hovertemplate: "%{x}<br>7-day: %{y:.2f} kg<extra></extra>",
      connectgaps: true,
    },
    {
      type: "scatter", mode: "lines", name: "30-day avg",
      x: xs, y: ma30,
      line: { color: "#4ade80", width: 2.5 },
      hovertemplate: "%{x}<br>30-day: %{y:.2f} kg<extra></extra>",
      connectgaps: true,
    },
  ];
  Plotly.newPlot("chart-weight", traces, {
    ...layoutDefaults,
    showlegend: false,
    margin: { l: 48, r: 16, t: 10, b: 40 },
    yaxis: { ...layoutDefaults.yaxis, range: [lo, hi], title: "kg" },
  }, plotlyConfig);
}

function renderComposition() {
  const dates = DEXA_SCANS.map(s => s.date);
  const fat = DEXA_SCANS.map(s => lb2kg(s.fatLbs));
  const lean = DEXA_SCANS.map(s => lb2kg(s.leanLbs));
  const bone = DEXA_SCANS.map(s => lb2kg(s.bmcLbs));
  Plotly.newPlot("chart-composition", [
    { type: "bar", name: "Fat", x: dates, y: fat,
      marker: { color: "#f59e0b" },
      hovertemplate: "Fat %{y:.2f} kg<extra></extra>" },
    { type: "bar", name: "Lean", x: dates, y: lean,
      marker: { color: "#4ade80" },
      hovertemplate: "Lean %{y:.2f} kg<extra></extra>" },
    { type: "bar", name: "Bone (BMC)", x: dates, y: bone,
      marker: { color: "#7c9cff" },
      hovertemplate: "Bone %{y:.2f} kg<extra></extra>" },
  ], {
    ...layoutDefaults,
    barmode: "stack",
    showlegend: true,
    legend: { orientation: "h", y: -0.2 },
    margin: { l: 48, r: 16, t: 10, b: 60 },
    yaxis: { ...layoutDefaults.yaxis, title: "kg" },
  }, plotlyConfig);
}

function renderRegional() {
  const last = DEXA_SCANS[DEXA_SCANS.length - 1];
  const regs = ["Arms", "Legs", "Trunk"];
  const fat = regs.map(r => lb2kg(last.regions[r].fatLbs));
  const lean = regs.map(r => lb2kg(last.regions[r].leanLbs));
  Plotly.newPlot("chart-regional", [
    { type: "bar", orientation: "h", name: "Fat",
      y: regs, x: fat,
      marker: { color: "#f59e0b" },
      hovertemplate: "%{y} fat: %{x:.2f} kg<extra></extra>" },
    { type: "bar", orientation: "h", name: "Lean",
      y: regs, x: lean,
      marker: { color: "#4ade80" },
      hovertemplate: "%{y} lean: %{x:.2f} kg<extra></extra>" },
  ], {
    ...layoutDefaults,
    barmode: "stack",
    showlegend: true,
    legend: { orientation: "h", y: -0.2 },
    margin: { l: 60, r: 16, t: 10, b: 60 },
    xaxis: { ...layoutDefaults.xaxis, title: "kg" },
  }, plotlyConfig);
}

function renderSymmetry() {
  const last = DEXA_SCANS[DEXA_SCANS.length - 1];
  const tbl = document.getElementById("symmetry-table");
  const pairs = [
    ["Arms", "Right arm", "Left arm"],
    ["Legs", "Right leg", "Left leg"],
  ];
  let html = `<thead><tr>
    <th>Limb</th><th class="num">Right (kg lean)</th>
    <th class="num">Left (kg lean)</th><th class="num">Δ</th></tr></thead><tbody>`;
  let imbalanceWarn = false;
  for (const [label, r, l] of pairs) {
    const rk = lb2kg(last.sides[r].leanLbs);
    const lk = lb2kg(last.sides[l].leanLbs);
    const diff = rk - lk;
    const diffLbs = Math.abs(last.sides[r].leanLbs - last.sides[l].leanLbs);
    if (diffLbs > 2) imbalanceWarn = true;
    const cls = Math.abs(diff) < 0.1 ? "change-flat" : (Math.abs(diff) > 0.9 ? "change-neg" : "change-flat");
    html += `<tr>
      <td>${label}</td>
      <td class="num">${fmt(rk, 2)}</td>
      <td class="num">${fmt(lk, 2)}</td>
      <td class="num ${cls}">${diff > 0 ? "+" : ""}${fmt(diff, 2)}</td>
    </tr>`;
  }
  html += "</tbody>";
  tbl.innerHTML = html;
  document.getElementById("symmetry-note").textContent = imbalanceWarn
    ? "⚠ Imbalance >2 lbs detected — flag for follow-up."
    : "All limb deltas under the 2 lb (≈0.9 kg) threshold. Balanced.";
}

function renderDexaTable() {
  const tbl = document.getElementById("dexa-table");
  let html = `<thead><tr>
    <th>Date</th>
    <th class="num">Weight</th>
    <th class="num">Lean</th>
    <th class="num">Fat</th>
    <th class="num">BF%</th>
    <th class="num">FFMI</th>
    <th class="num">VAT</th>
  </tr></thead><tbody>`;
  for (let i = DEXA_SCANS.length - 1; i >= 0; i--) {
    const s = DEXA_SCANS[i];
    html += `<tr>
      <td>${s.date}</td>
      <td class="num">${fmt(lb2kg(s.totalLbs), 1)}</td>
      <td class="num">${fmt(lb2kg(s.leanLbs), 1)}</td>
      <td class="num">${fmt(lb2kg(s.fatLbs), 1)}</td>
      <td class="num">${fmt(s.bodyFatPct, 1)}</td>
      <td class="num">${fmt(ffmiNormalized(s), 2)}</td>
      <td class="num">${fmt(lb2kg(s.vatLbs) * 1000, 0)} g</td>
    </tr>`;
  }
  html += "</tbody>";
  tbl.innerHTML = html;
}

// ============================================================
// Entry point
// ============================================================
async function main() {
  try {
    const resp = await fetch(WEIGHT_CSV_URL, { cache: "no-store" });
    let weights = [];
    if (resp.ok) {
      const text = await resp.text();
      const parsed = Papa.parse(text, { skipEmptyLines: true });
      weights = parseWeightCSV(parsed.data);
    } else {
      console.warn("Weight CSV fetch failed:", resp.status);
    }
    renderDashboard(weights);
    if (weights.length === 0) {
      const status = document.getElementById("data-status");
      status.textContent = "No weight data — check the publish-to-web setting in the sheet (must be 'Entire document' or include the weight tab).";
      status.style.color = "var(--warn)";
    }
  } catch (err) {
    const content = document.getElementById("content");
    content.className = "error";
    content.textContent = `Could not load: ${err.message}`;
    console.error(err);
  }
}

main();
</script>
